<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warcdddd: Taxi de otro mundo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10131d;
      color: #fff;
      font-family: sans-serif;
    }
    main {
      width: min(96vw, 800px);
      text-align: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 4px solid #e8e7ff;
      border-radius: 10px;
      background: #252834;
      outline: none;
    }
    p {
      margin: 10px 0 0;
      color: #d3d5e5;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" width="800" height="600" tabindex="0" aria-label="Juego Warcdddd: Taxi de otro mundo"></canvas>
    <p>Haz clic en el juego para que funcionen las flechas.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
